title: Jack Lukomski
description: Notes on building software, AI, and whatever else I'm working on.
url: https://jack-lukomski.github.io
baseurl: ""
author: Jack Lukomski
github_username: Jack-Lukomski

# The github-pages gem enables the Primer theme by default. This site uses its
# own layouts and styles.css, so turn it off (its Sass also breaks non-UTF-8 builds).
theme: null

permalink: /blog/:year/:month/:day/:title.html
timezone: America/Chicago

plugins:
  - jekyll-seo-tag
  - jekyll-feed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - wrangler.jsonc
